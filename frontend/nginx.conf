server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS server. Re-resolve `backend` on this TTL instead
    # of caching it for the life of the worker process -- otherwise a
    # backend container restart (new IP) leaves nginx proxying to a dead
    # address until nginx itself restarts.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10M;
    }

    location /health {
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8000$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
