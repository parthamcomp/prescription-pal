# Render blueprint. Deploy API + worker from one repo.
# Managed Postgres + Redis are provisioned here; to use Neon/Upstash instead,
# set DATABASE_URL / REDIS_URL to sync:false and paste the external URLs.
databases:
  - name: medassist-db
    postgresMajorVersion: "16"
    plan: free

services:
  - type: redis
    name: medassist-redis
    plan: free
    ipAllowList: []

  - type: web
    name: medassist-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medassist-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: medassist-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENFORCE_HTTPS
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      # Split frontend origin (Cloudflare Pages) requires SameSite=none;
      # COOKIE_SECURE=true above is required alongside it.
      - key: COOKIE_SAMESITE
        value: none
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CHAT_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EMBED_MODEL
        value: text-embedding-3-small
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: worker
    name: medassist-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.worker
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medassist-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: medassist-redis
          property: connectionString
      # The worker never validates a token itself, but it imports the same
      # Settings object as the API - jwt_secret has no default, so it must
      # be set or the process won't start. It doesn't need to match the
      # API's value since the worker never signs/verifies anything with it.
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CHAT_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EMBED_MODEL
        value: text-embedding-3-small
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
